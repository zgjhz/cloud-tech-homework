name: cloud-homework-02
services:
  db:
    build: ./db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
  entrypoint:
    build:
      context: .
      target: runtime
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?Copy .env.example to .env}
      PGUSER: ${POSTGRES_USER:?Copy .env.example to .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    ports:
      - "127.0.0.1:8082:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lab
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
networks:
  lab:
volumes:
  postgres-data:
